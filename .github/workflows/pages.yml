# Publica o site no GitHub Pages a cada push na main.
#
# configure-pages com enablement: true tenta ligar o Pages no próprio
# repositório. Na primeira tentativa isso falhou com "Resource not
# accessible by integration", enquanto o repositório era privado. Agora
# que ele é público, vale a segunda tentativa: pode ter sido o plano,
# não o escopo do token.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ligar o Pages se ainda não estiver ligado
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # a raiz inteira do repositório: o index.html está nela
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publicacao
        uses: actions/deploy-pages@v4
