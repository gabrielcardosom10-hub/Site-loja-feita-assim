# Publica o site no GitHub Pages a cada push na main.
#
# O passo configure-pages com enablement: true liga o Pages no repositório
# sozinho, sem ninguém entrar em Settings. Ele precisa da permissão
# pages: write, que está declarada abaixo.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; a mais nova espera a anterior terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ligar o Pages se ainda não estiver ligado
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # a raiz do repositório inteira: o index.html está nela
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacao
        uses: actions/deploy-pages@v4
